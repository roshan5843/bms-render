name: BMS DailyBO Optimized (Shard + Combine + Self Loop)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"   # backup trigger every 3 hours

permissions:
  contents: write

concurrency:
  group: bms-dailybo-global
  cancel-in-progress: false

jobs:

# =====================================================
# 1️⃣ SHARDS (PARALLEL - NO GIT PUSH)
# =====================================================
  shards:
    name: Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8,9]

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 🌐 Verify Chrome
        run: |
          google-chrome --version || echo "Chrome already available"

      - name: 🚀 Run shard scraper
        env:
          MY_API_URL: ${{ matrix.shard == 9 && secrets.MY_API_URL || '' }}
        run: |
          python bmsdaily${{ matrix.shard }}.py

      - name: 📤 Upload shard data
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: daily/

# =====================================================
# 2️⃣ COMBINE + PUSH + MONGODB
# =====================================================
  combine:
    name: Combine + MongoDB Sync
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 📥 Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: shards

      - name: 🔁 Combine shards
        run: |
          python combine_dailyshards.py

      - name: 💾 Commit & push combined data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add daily/
          git commit -m "Final combined BMS data ($(date -u +'%Y-%m-%d %H:%M UTC'))" || echo "No changes"

          git push origin main

      - name: 🔄 Sync to MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
        run: |
          python mongodb/sync.py

# =====================================================
# 3️⃣ SELF-HEALING NEXT RUN (CORE FIX)
# =====================================================
  schedule-next-run:
    name: Schedule Next Run
    needs: combine
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: ⏳ Wait until next hour
        run: |
          echo "Current UTC time:"
          date -u

          MIN=$(date -u +%M)
          SEC=$(date -u +%S)

          WAIT=$((3600 - (MIN*60 + SEC)))

          echo "Sleeping $WAIT seconds until next hour..."
          sleep $WAIT

      - name: 🔁 Trigger next run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: context.workflow,
              ref: context.ref
            });

# =====================================================
# 4️⃣ AUTO RETRY IF COMBINE FAILS
# =====================================================
  retry-combine:
    name: Retry Combine
    needs: combine
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Re-trigger workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: context.workflow,
              ref: context.ref
            });
