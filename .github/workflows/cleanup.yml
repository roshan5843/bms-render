name: Cleanup Extra Shard JSONs (R2)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"   # Daily 03:00 IST

permissions:
  contents: read   # no git writes needed anymore

jobs:
  cleanup:
    name: Remove shard-level JSON files from R2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧾 Checkout repo (code only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          pip install pytz boto3

      - name: 🧹 Run R2 cleanup
        env:
          R2_ENDPOINT:      ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY:    ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY:    ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET:        ${{ secrets.R2_BUCKET }}
          R2_BUCKET_ADVANCE: ${{ secrets.R2_BUCKET_ADVANCE }}
        run: |
          python cleanup_shard_files.py